<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="230" viewBox="0 0 1000 230" role="img" aria-label="MeetRec banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1733"/>
      <stop offset="0.55" stop-color="#142650"/>
      <stop offset="1" stop-color="#1d3f85"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="230" rx="18" fill="url(#bg)"/>
  <circle cx="880" cy="30" r="90" fill="#3b82f6" opacity="0.12"/>
  <circle cx="960" cy="200" r="70" fill="#e11d48" opacity="0.10"/>
  <circle cx="60" cy="215" r="55" fill="#3b82f6" opacity="0.10"/>

  <!-- app icon -->
  <rect x="56" y="70" width="90" height="90" rx="22" fill="url(#tile)"/>
  <rect x="72" y="92" width="58" height="40" rx="7" fill="#ffffff"/>
  <circle cx="101" cy="112" r="11" fill="#e11d48"/>
  <rect x="88" y="140" width="26" height="6" rx="3" fill="#ffffff" opacity="0.85"/>

  <!-- title -->
  <text x="180" y="118" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="58" font-weight="700" fill="#ffffff" letter-spacing="1">MeetRec</text>
  <text x="182" y="150" font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif" font-size="21" fill="#d7e1f8">会议与演示的窗口录制器 · Window recorder for meetings &amp; demos</text>
  <text x="182" y="178" font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif" font-size="15" fill="#93a8d8">只录一个窗口 · 混入系统声音与麦克风 · 干净 H.264 MP4</text>
  <text x="182" y="200" font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif" font-size="13" fill="#6f86bd">Record one window · mixed audio · clean H.264 MP4</text>

  <!-- REC chip -->
  <rect x="778" y="86" width="176" height="42" rx="21" fill="#e11d48" opacity="0.16" stroke="#e11d48" stroke-opacity="0.8"/>
  <circle cx="802" cy="107" r="7" fill="#f43f5e"/>
  <text x="820" y="113" font-family="Consolas, Menlo, monospace" font-size="17" fill="#ffd4de">REC 00:17:59</text>

  <!-- v-chip -->
  <rect x="778" y="142" width="176" height="42" rx="21" fill="#ffffff" opacity="0.08" stroke="#8fa9e8" stroke-opacity="0.5"/>
  <text x="866" y="169" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="16" fill="#cdd9f5">1.1 · Windows x64</text>
</svg>
